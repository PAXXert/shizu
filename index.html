<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shizu — liens</title>
<meta name="description" content="Shizu : l'anime en grand. YouTube, Instagram, photos Cyberpunk.">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;800;900&display=swap" rel="stylesheet">
<style>
:root{--rouge:#e3262f;--fond:#0b0b0c;--carte:#17171a;--texte:#f4f1ec;--gris:#9a9aa2}
*{box-sizing:border-box;margin:0}
body{background:var(--fond);color:var(--texte);font-family:Montserrat,system-ui,sans-serif;min-height:100vh;display:flex;justify-content:center;padding:56px 16px}
main{width:100%;max-width:440px;text-align:center}
.logo{width:104px;height:104px;border-radius:50%;background:#fff;display:grid;place-items:center;margin:0 auto 18px}
.logo span{width:88px;height:88px;border-radius:50%;background:var(--rouge);color:#fff;display:grid;place-items:center;font-weight:900;font-size:19px;letter-spacing:.5px}
h1{font-size:24px;font-weight:900}
p.sous{color:var(--gris);font-weight:500;margin:6px 0 32px;font-size:15px}
a.lien{display:flex;align-items:center;gap:14px;background:var(--carte);border:1px solid #26262b;border-radius:16px;padding:16px 18px;margin-bottom:12px;color:var(--texte);text-decoration:none;text-align:left;transition:transform .15s,border-color .15s}
a.lien:hover{transform:translateY(-2px);border-color:var(--rouge)}
.ic{flex:none;width:42px;height:42px;border-radius:12px;display:grid;place-items:center}
.ic svg{width:24px;height:24px;fill:#fff}
.yt{background:#ff0000}.tt{background:#000;border:1px solid #333}.ig{background:linear-gradient(45deg,#f9a825,#e1306c,#833ab4)}
b{display:block;font-weight:800;font-size:16px}
small{color:var(--gris);font-weight:500;font-size:13px}
</style>
</head>
<body>
<main>
  <div class="logo"><span>SHIZU</span></div>
  <h1>Shizu</h1>
  <p class="sous">L'anime, en grand.</p>
